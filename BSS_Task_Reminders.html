<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BSS Task Reminders</title>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;background:#f0f3f8;color:#1e293b}
input,textarea,button{font-family:inherit;font-size:inherit}
button{cursor:pointer}

/* ── Layout ── */
:root{--sb:255px}
.app{display:flex;min-height:100vh}

/* ── Sidebar ── */
.sidebar{
  width:var(--sb);flex-shrink:0;
  background:#0f172a;color:#e2e8f0;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:#1e3a5f transparent;
}
.sb-head{padding:1.1rem 1rem .9rem;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:.6rem}
.sb-icon{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:1rem}
.sb-title{font-weight:700;font-size:.88rem}
.sb-date{font-size:.65rem;color:#475569;margin-top:.1rem}
.sb-sec{padding:.65rem .9rem}
.sb-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:#475569;margin-bottom:.4rem;padding:0 .3rem}
.sb-div{border:none;border-top:1px solid rgba(255,255,255,.07);margin:.1rem .9rem}
.nb{display:flex;align-items:center;gap:.55rem;padding:.38rem .5rem;border-radius:7px;cursor:pointer;color:#94a3b8;font-size:.8rem;transition:background .12s,color .12s;user-select:none;border:none;background:transparent;width:100%;text-align:left}
.nb:hover{background:rgba(255,255,255,.07);color:#e2e8f0}
.nb.on{background:rgba(99,102,241,.22);color:#a5b4fc}
.nb .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.nb .cnt{margin-left:auto;font-size:.62rem;padding:.12em .5em;border-radius:999px;background:rgba(255,255,255,.1);color:#94a3b8;min-width:18px;text-align:center}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(240,243,248,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #e2e8f0;
  padding:.7rem 1.3rem;
  display:flex;align-items:center;gap:.8rem;
}
.topbar h1{font-size:.98rem;font-weight:700;margin:0}
.topbar .sub{font-size:.7rem;color:#94a3b8;margin-top:.1rem}
.search{
  display:flex;align-items:center;gap:.4rem;
  background:white;border:1px solid #e2e8f0;border-radius:8px;
  padding:.32rem .7rem;width:260px;transition:box-shadow .15s,border-color .15s;
}
.search:focus-within{box-shadow:0 0 0 3px rgba(99,102,241,.15);border-color:#a5b4fc}
.search input{border:none;outline:none;font-size:.82rem;background:transparent;flex:1;width:100%}
.search svg{flex-shrink:0;color:#94a3b8}

/* ── Content ── */
.content{padding:1.2rem 1.3rem;flex:1}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:white;border-radius:12px;padding:.9rem 1rem;border:1px solid #e8edf3}
.stat-n{font-size:1.75rem;font-weight:800;line-height:1}
.stat-l{font-size:.7rem;color:#94a3b8;margin-top:.2rem}
.stat-bar{height:3px;border-radius:2px;background:#e2e8f0;margin-top:.65rem;overflow:hidden}
.stat-fill{height:100%;border-radius:2px;transition:width .6s ease}

/* ── Banners ── */
.banner{border-radius:12px;padding:.85rem 1.05rem;margin-bottom:.65rem;display:flex;align-items:flex-start;gap:.7rem}
.banner.red{background:linear-gradient(135deg,#ef4444,#dc2626);color:white}
.banner.amber{background:linear-gradient(135deg,#f59e0b,#f97316);color:white}
.ban-ico{font-size:1.3rem;flex-shrink:0;line-height:1.4}
.ban-title{font-weight:700;font-size:.86rem;margin-bottom:.25rem}
.ban-row{font-size:.77rem;opacity:.92}

/* ── Import strip ── */
.import-strip{
  background:white;border:1.5px dashed #cbd5e1;border-radius:11px;
  padding:.65rem 1rem;margin-bottom:.9rem;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  color:#64748b;font-size:.79rem;
}
.import-lbl{color:#2563eb;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.3rem}
.import-lbl:hover{text-decoration:underline}
#xl-input{display:none}
#import-msg{margin-left:auto;font-size:.72rem}

/* ── Task cards ── */
.task-card{
  background:white;border-radius:11px;padding:.85rem .95rem;margin-bottom:.5rem;
  border:1px solid #e8edf3;border-left:4px solid transparent;
  transition:box-shadow .14s,transform .1s;
}
.task-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-1px)}
.task-card.today   {border-left-color:#ef4444;background:#fff8f8}
.task-card.tomorrow{border-left-color:#f59e0b;background:#fffbf0}
.task-card.overdue {border-left-color:#dc2626;background:#fff5f5}
.task-card.done    {opacity:.55}
.task-card.done .tname{text-decoration:line-through;color:#94a3b8}

.card-inner{display:flex;gap:.75rem;align-items:flex-start}
.cbx{width:16px;height:16px;flex-shrink:0;margin-top:2px;cursor:pointer;accent-color:#6366f1}
.card-body{flex:1;min-width:0}
.card-top{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin-bottom:.2rem}
.tname{font-weight:600;font-size:.87rem}
.tdesc{font-size:.75rem;color:#64748b;margin-top:.15rem}
.card-meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.5rem}
.card-actions{display:flex;flex-direction:column;gap:.4rem;flex-shrink:0}

/* ── Pills ── */
.pill{display:inline-block;padding:.2em .6em;border-radius:999px;font-size:.65rem;font-weight:600;line-height:1.4}
.pill.today-tag  {background:#ef4444;color:white}
.pill.tmrw-tag   {background:#f59e0b;color:white}
.pill.over-tag   {background:#dc2626;color:white}
.pill.done-tag   {background:#dcfce7;color:#16a34a}

/* ── Buttons ── */
.btn{border-radius:7px;font-size:.75rem;padding:.28rem .7rem;display:inline-flex;align-items:center;gap:.3rem;border:1px solid;transition:background .12s;white-space:nowrap}
.btn-done {background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.btn-done:hover{background:#dcfce7}
.btn-undo {background:#f8fafc;color:#475569;border-color:#e2e8f0}
.btn-undo:hover{background:#f1f5f9}
.btn-email{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.btn-email:hover{background:#dbeafe}
.btn-primary{background:#6366f1;color:white;border-color:#6366f1;padding:.38rem .9rem;font-size:.82rem}
.btn-primary:hover{background:#4f46e5}
.btn-light{background:#f1f5f9;color:#475569;border-color:#e2e8f0;padding:.38rem .9rem;font-size:.82rem}
.btn-light:hover{background:#e2e8f0}
.btn-success{background:#16a34a;color:white;border-color:#16a34a;padding:.38rem .9rem;font-size:.82rem}
.btn-success:hover{background:#15803d}

/* ── Empty state ── */
.empty{text-align:center;padding:3.5rem 1rem;color:#cbd5e1}
.empty .ico{font-size:2.5rem;opacity:.4}

/* ── Overlay / Modal ── */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:1000;align-items:center;justify-content:center;padding:1rem;
}
.overlay.show{display:flex}
.dialog{
  background:white;border-radius:16px;width:100%;padding:1.4rem;
  box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative;
  max-height:90vh;overflow-y:auto;
}
.dialog.sm{max-width:480px}
.dialog.lg{max-width:620px}
.dlg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.dlg-title{font-weight:700;font-size:.97rem;display:flex;align-items:center;gap:.4rem}
.dlg-close{background:none;border:none;font-size:1.3rem;color:#94a3b8;cursor:pointer;line-height:1;padding:.1rem .3rem;border-radius:5px}
.dlg-close:hover{background:#f1f5f9;color:#475569}
.dlg-footer{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.2rem}
.info-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:.75rem .9rem;margin-bottom:.9rem}
.info-box .iname{font-weight:600;font-size:.87rem}
.info-box .idesc{font-size:.76rem;color:#64748b;margin-top:.2rem}
.info-pills{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
label.form-lbl{display:block;font-weight:600;font-size:.76rem;color:#64748b;margin-bottom:.35rem}
textarea.form-ctrl,input.form-ctrl{
  width:100%;border:1px solid #e2e8f0;border-radius:9px;padding:.55rem .75rem;
  font-size:.83rem;outline:none;resize:vertical;transition:box-shadow .15s,border-color .15s;
}
textarea.form-ctrl:focus,input.form-ctrl:focus{box-shadow:0 0 0 3px rgba(99,102,241,.15);border-color:#a5b4fc}
.form-row{margin-bottom:.75rem}

/* ── Toast ── */
.toast{
  position:fixed;bottom:1.2rem;right:1.2rem;
  padding:.65rem 1rem;border-radius:10px;color:white;
  font-size:.82rem;font-weight:600;z-index:2000;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
  transform:translateY(120%);opacity:0;
  transition:transform .25s ease,opacity .25s ease;
  pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1}

/* ── Mobile ── */
@media(max-width:768px){
  :root{--sb:0px}
  .sidebar{display:none}
  .sidebar.mob-open{display:flex;position:fixed;z-index:500;width:255px}
  .mob-burger{display:flex!important}
  .search{width:100%}
}
.mob-burger{display:none;background:none;border:1px solid #e2e8f0;border-radius:7px;padding:.3rem .55rem;font-size:1.1rem;margin-right:.2rem}
</style>
</head>
<body>
<div class="app">

<!-- ════ SIDEBAR ════ -->
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-icon">🔔</div>
    <div>
      <div class="sb-title">BSS Reminders</div>
      <div class="sb-date" id="sb-date">—</div>
    </div>
  </div>

  <!-- Status filters -->
  <div class="sb-sec">
    <div class="sb-lbl">View</div>
    <button class="nb on" data-sf="all"     onclick="setSF('all',this)">    <span>⬛</span>All Tasks   <span class="cnt" id="cnt-all">—</span></button>
    <button class="nb"    data-sf="pending"  onclick="setSF('pending',this)"><span>🕐</span>Pending     <span class="cnt" id="cnt-pend">—</span></button>
    <button class="nb"    data-sf="done"     onclick="setSF('done',this)">  <span>✅</span>Completed   <span class="cnt" id="cnt-done">—</span></button>
    <button class="nb"    data-sf="overdue"  onclick="setSF('overdue',this)"><span style="color:#f87171;">⚠️</span>Overdue  <span class="cnt" id="cnt-over">—</span></button>
  </div>

  <hr class="sb-div"/>

  <!-- Priority filters -->
  <div class="sb-sec">
    <div class="sb-lbl">Priority</div>
    <button class="nb" onclick="togglePri('High',this)">   <span class="dot" style="background:#ef4444"></span>High</button>
    <button class="nb" onclick="togglePri('Medium',this)"> <span class="dot" style="background:#f59e0b"></span>Medium</button>
    <button class="nb" onclick="togglePri('Low',this)">    <span class="dot" style="background:#22c55e"></span>Low</button>
  </div>

  <hr class="sb-div"/>

  <!-- Category filters -->
  <div class="sb-sec" style="flex:1">
    <div class="sb-lbl">Categories</div>
    <div id="cat-list"></div>
  </div>
</aside>

<!-- ════ MAIN ════ -->
<div class="main">

  <!-- Topbar -->
  <div class="topbar">
    <button class="mob-burger" onclick="document.getElementById('sidebar').classList.toggle('mob-open')">☰</button>
    <div>
      <h1>Task Dashboard</h1>
      <div class="sub" id="task-count">Loading…</div>
    </div>
    <div style="margin-left:auto">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search tasks…" oninput="render()">
      </div>
    </div>
  </div>

  <div class="content">

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Import strip -->
    <div class="import-strip">
      <span>📊</span>
      <span>Update tasks from a new Excel file:</span>
      <label class="import-lbl">
        ⬆ Choose .xlsx
        <input type="file" id="xl-input" accept=".xlsx" onchange="importExcel(this)">
      </label>
      <span id="import-msg"></span>
    </div>

    <!-- Banners -->
    <div id="banners"></div>

    <!-- Task list -->
    <div id="task-list"></div>

  </div>
</div>
</div><!-- /.app -->

<!-- ════ MODAL: Mark Done ════ -->
<div class="overlay" id="done-overlay" onclick="closeOverlay('done-overlay',event)">
  <div class="dialog sm" onclick="event.stopPropagation()">
    <div class="dlg-head">
      <div class="dlg-title">✅ Mark Task as Done</div>
      <button class="dlg-close" onclick="closeOverlay('done-overlay')">✕</button>
    </div>
    <div class="info-box">
      <div class="iname" id="m-name"></div>
      <div class="idesc" id="m-desc"></div>
      <div class="info-pills" id="m-pills"></div>
    </div>
    <div class="form-row">
      <label class="form-lbl">Completion Notes <span style="font-weight:400;color:#94a3b8">(optional)</span></label>
      <textarea class="form-ctrl" id="m-notes" rows="3" placeholder="How was this completed? Any follow-up?"></textarea>
    </div>
    <div class="dlg-footer">
      <button class="btn btn-light" onclick="closeOverlay('done-overlay')">Cancel</button>
      <button class="btn btn-success" onclick="confirmDone()">✓ Mark as Done</button>
    </div>
  </div>
</div>

<!-- ════ MODAL: Email ════ -->
<div class="overlay" id="email-overlay" onclick="closeOverlay('email-overlay',event)">
  <div class="dialog lg" onclick="event.stopPropagation()">
    <div class="dlg-head">
      <div class="dlg-title">📧 Send Email Reminder</div>
      <button class="dlg-close" onclick="closeOverlay('email-overlay')">✕</button>
    </div>
    <div class="form-row">
      <label class="form-lbl">To</label>
      <input class="form-ctrl" type="email" id="e-to" placeholder="recipient@example.com">
    </div>
    <div class="form-row">
      <label class="form-lbl">Subject</label>
      <input class="form-ctrl" type="text" id="e-sub">
    </div>
    <div class="form-row">
      <label class="form-lbl">Message</label>
      <textarea class="form-ctrl" id="e-body" rows="8"></textarea>
    </div>
    <div class="dlg-footer">
      <button class="btn btn-light" onclick="closeOverlay('email-overlay')">Cancel</button>
      <button class="btn btn-primary" onclick="sendEmail()">📤 Open in Email App</button>
    </div>
  </div>
</div>

<!-- ════ TOAST ════ -->
<div class="toast" id="toast"></div>

  "Financial":         {bg:"#fef3c7",fg:"#b45309",dot:"#f59e0b"},
  "Administration":    {bg:"#f1f5f9",fg:"#475569",dot:"#94a3b8"},
  "General":           {bg:"#f8fafc",fg:"#64748b",dot:"#cbd5e1"},
};
const PRI_COL = {
  "High":   {bg:"#fee2e2",fg:"#dc2626"},
  "Medium": {bg:"#fef3c7",fg:"#d97706"},
  "Low":    {bg:"#dcfce7",fg:"#16a34a"},
};

/* ── Storage ──────────────────────────────── */
const TK = "bss_tasks_v3", SK = "bss_status_v3";
const getTasks  = () => { try{const s=localStorage.getItem(TK); return s?JSON.parse(s):BUILTIN;}catch{return BUILTIN;} };
const saveTasks = t  => { try{localStorage.setItem(TK,JSON.stringify(t));}catch{} };
const getStatus = () => { try{const s=localStorage.getItem(SK); return s?JSON.parse(s):{} ;}catch{return{};} };
const saveStatus= s  => { try{localStorage.setItem(SK,JSON.stringify(s));}catch{} };

/* ── Date helpers ─────────────────────────── */
function pad(n){return String(n).padStart(2,"0")}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function tomorrowStr(){const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fmtDate(s){
  if(!s)return"No date";
  const[y,m,d]=s.split("-");
  return new Date(+y,+m-1,+d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
}

/* ── Enrich tasks with live status & date flags ── */
function enrich(tasks){
  const status=getStatus(), today=todayStr(), tmrw=tomorrowStr();
  return tasks.map(t=>{
    const st=status[t.id]||{};
    return {...t,
      done:       !!st.done,
      notes:      st.notes||"",
      completedAt:st.completedAt||"",
      isToday:    t.date===today,
      isTmrw:     t.date===tmrw,
      isOverdue:  !!t.date && t.date<today && !st.done,
    };
  });
}

/* ── Filter state ─────────────────────────── */
let sf="all", priF=new Set(), catF=new Set(), activeId=null;

function setSF(mode,el){
  sf=mode;
  document.querySelectorAll(".nb[data-sf]").forEach(e=>e.classList.remove("on"));
  el.classList.add("on");
  render();
}
function togglePri(p,el){priF.has(p)?priF.delete(p):priF.add(p);el.classList.toggle("on");render()}
function toggleCat(c,el){catF.has(c)?catF.delete(c):catF.add(c);el.classList.toggle("on");render()}

function filtered(tasks){
  const q=document.getElementById("search").value.toLowerCase();
  return tasks.filter(t=>{
    if(sf==="pending" &&  t.done)        return false;
    if(sf==="done"    && !t.done)        return false;
    if(sf==="overdue" && !t.isOverdue)   return false;
    if(priF.size && !priF.has(t.pri))    return false;
    if(catF.size && !catF.has(t.cat))    return false;
    if(q && !t.name.toLowerCase().includes(q) && !t.desc.toLowerCase().includes(q)) return false;
    return true;
  });
}

/* ── Pill helper ──────────────────────────── */
function pill(txt,bg,fg){return `<span class="pill" style="background:${bg};color:${fg}">${txt}</span>`}

/* ── Render stats ─────────────────────────── */
function renderStats(tasks){
  const total=tasks.length, done=tasks.filter(t=>t.done).length,
        over=tasks.filter(t=>t.isOverdue).length,
        tmrw=tasks.filter(t=>t.isTmrw&&!t.done).length,
        pct=total?Math.round(done/total*100):0;
  document.getElementById("cnt-all").textContent  = total;
  document.getElementById("cnt-pend").textContent = total-done;
  document.getElementById("cnt-done").textContent = done;
  document.getElementById("cnt-over").textContent = over;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="stat-n" style="color:#6366f1">${total}</div><div class="stat-l">Total Tasks</div>
      <div class="stat-bar"><div class="stat-fill" style="width:${pct}%;background:#6366f1"></div></div>
      <div style="font-size:.67rem;color:#94a3b8;margin-top:.2rem">${pct}% complete</div></div>
    <div class="stat"><div class="stat-n" style="color:#16a34a">${done}</div><div class="stat-l">Completed</div></div>
    <div class="stat"><div class="stat-n" style="color:#f59e0b">${tmrw}</div><div class="stat-l">Due Tomorrow</div></div>
    <div class="stat"><div class="stat-n" style="color:#ef4444">${over}</div><div class="stat-l">Overdue</div></div>`;
}

/* ── Render banners ───────────────────────── */
function renderBanners(tasks){
  const tday=tasks.filter(t=>t.isToday&&!t.done), tmrw=tasks.filter(t=>t.isTmrw&&!t.done);
  let h="";
  if(tday.length) h+=`<div class="banner red">
    <span class="ban-ico">🚨</span>
    <div><div class="ban-title">${tday.length} task${tday.length>1?"s":""} due TODAY</div>
    ${tday.map(t=>`<div class="ban-row">• ${t.name} <span style="opacity:.75">(${t.pri})</span></div>`).join("")}
    </div></div>`;
  if(tmrw.length) h+=`<div class="banner amber">
    <span class="ban-ico">⏰</span>
    <div><div class="ban-title">${tmrw.length} reminder${tmrw.length>1?"s":""} for TOMORROW</div>
    ${tmrw.map(t=>`<div class="ban-row">• ${t.name} <span style="opacity:.75">(${t.pri})</span></div>`).join("")}
    </div></div>`;
  document.getElementById("banners").innerHTML=h;
}

/* ── Render category sidebar ──────────────── */
function renderCats(tasks){
  const cats=[...new Set(tasks.map(t=>t.cat))].sort();
  document.getElementById("cat-list").innerHTML=cats.map(c=>{
    const col=CAT_COL[c]||CAT_COL["General"], n=tasks.filter(t=>t.cat===c).length;
    return `<button class="nb" onclick="toggleCat('${c}',this)">
      <span class="dot" style="background:${col.dot}"></span>${c}
      <span class="cnt">${n}</span></button>`;
  }).join("");
}

/* ── Main render ──────────────────────────── */
function render(){
  const all=enrich(getTasks()), vis=filtered(all);
  renderStats(all);
  renderBanners(all);
  document.getElementById("task-count").textContent=`${vis.length} task${vis.length!==1?"s":""}`;

  if(!vis.length){
    document.getElementById("task-list").innerHTML=
      `<div class="empty"><div class="ico">📭</div><p style="margin-top:.6rem;font-size:.87rem">No tasks match your filters</p></div>`;
    return;
  }

  // Sort: today first → tomorrow → overdue → upcoming by date → done last
  vis.sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    const r=t=>t.isToday?0:t.isTmrw?1:t.isOverdue?2:3;
    if(r(a)!==r(b)) return r(a)-r(b);
    return (a.date||"").localeCompare(b.date||"");
  });

  document.getElementById("task-list").innerHTML=vis.map(t=>{
    const cat=CAT_COL[t.cat]||CAT_COL["General"], pri=PRI_COL[t.pri]||PRI_COL["Low"];
    let tag="", cls="";
    if(t.isToday)    {tag=`<span class="pill today-tag">TODAY</span>`;   cls="today"}
    else if(t.isTmrw){tag=`<span class="pill tmrw-tag">TOMORROW</span>`;cls="tomorrow"}
    else if(t.isOverdue){tag=`<span class="pill over-tag">OVERDUE</span>`;cls="overdue"}

    const actionBtn = t.done
      ? `<button class="btn btn-undo"  onclick="undo(${t.id})">↩ Undo</button>`
      : `<button class="btn btn-done"  onclick="openDone(${t.id})">✓ Done</button>`;

    const meta = [
      pill(t.pri, pri.bg, pri.fg),
      pill(t.cat, cat.bg, cat.fg),
      `<span style="font-size:.7rem;color:#94a3b8">📅 ${fmtDate(t.date)}</span>`,
      t.done ? `<span class="pill done-tag">✓ Completed${t.completedAt?" · "+new Date(t.completedAt).toLocaleDateString():""}</span>` : "",
      t.done && t.notes ? `<span style="font-size:.69rem;color:#94a3b8">📝 ${t.notes}</span>` : "",
    ].filter(Boolean).join("");

    return `<div class="task-card ${cls} ${t.done?"done":""}">
      <div class="card-inner">
        <input type="checkbox" class="cbx" ${t.done?"checked":""} onchange="handleChk(${t.id},this.checked)">
        <div class="card-body">
          <div class="card-top"><span class="tname">${t.name}</span>${tag}</div>
          <div class="tdesc">${t.desc}</div>
          <div class="card-meta">${meta}</div>
        </div>
        <div class="card-actions">
          ${actionBtn}
          <button class="btn btn-email" onclick="openEmail(${t.id})">📧 Email</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* ── Actions ──────────────────────────────── */
function handleChk(id,checked){checked?openDone(id):undo(id)}

function openDone(id){
  const t=enrich(getTasks()).find(x=>x.id===id); if(!t)return;
  activeId=id;
  document.getElementById("m-name").textContent = t.name;
  document.getElementById("m-desc").textContent = t.desc;
  document.getElementById("m-notes").value      = t.notes||"";
  const cat=CAT_COL[t.cat]||CAT_COL["General"], pri=PRI_COL[t.pri]||PRI_COL["Low"];
  document.getElementById("m-pills").innerHTML  =
    pill(t.pri,pri.bg,pri.fg)+" "+pill(t.cat,cat.bg,cat.fg)+
    ` <span style="font-size:.7rem;color:#94a3b8">📅 ${fmtDate(t.date)}</span>`;
  openOverlay("done-overlay");
}

function confirmDone(){
  const notes=document.getElementById("m-notes").value.trim();
  const status=getStatus();
  status[activeId]={done:true,notes,completedAt:new Date().toISOString()};
  saveStatus(status);
  closeOverlay("done-overlay");
  showToast("✓ Task marked as done!","#16a34a");
  render();
}

function undo(id){
  const status=getStatus(); delete status[id]; saveStatus(status);
  showToast("Task moved back to pending","#475569"); render();
}

function openEmail(id){
  const t=enrich(getTasks()).find(x=>x.id===id); if(!t)return;
  activeId=id;
  document.getElementById("e-to").value  = "";
  document.getElementById("e-sub").value = `Task Reminder: ${t.name} — Due ${fmtDate(t.date)}`;
  document.getElementById("e-body").value=
`Hi,

This is a reminder for the following task:

  Task        : ${t.name}
  Description : ${t.desc}
  Due Date    : ${fmtDate(t.date)}
  Priority    : ${t.pri}
  Category    : ${t.cat}

Please ensure this is actioned on time.

Regards`;
  openOverlay("email-overlay");
}

function sendEmail(){
  const to=document.getElementById("e-to").value;
  const sub=encodeURIComponent(document.getElementById("e-sub").value);
  const bod=encodeURIComponent(document.getElementById("e-body").value);
  window.location.href=`mailto:${to}?subject=${sub}&body=${bod}`;
  closeOverlay("email-overlay");
  showToast("Email app opened!","#2563eb");
}

/* ── Excel import ─────────────────────────── */
function assignCat(name){
  const n=name.toLowerCase();
  const map=[
    ["Certificates",      ["certificate"]],
    ["Recovery",          ["recovery contest","recoverable","withdrawal"]],
    ["Training",          ["training","quiz"]],
    ["QA & Reporting",    ["scores","qa check","circulate q"]],
    ["Passouts",          ["passout"]],
    ["ID Cards",          ["pvc","card"]],
    ["Appraisals",        ["appraisal"]],
    ["Admissions",        ["admission"]],
    ["Sprint Management", ["sprint"]],
    ["Financial",         ["financial","voucher"]],
    ["Administration",    ["science lab","section allocation","calendar year"]],
  ];
  for(const[cat,kws]of map) if(kws.some(k=>n.includes(k))) return cat;
  return "General";
}

function importExcel(input){
  const file=input.files[0]; if(!file)return;
  const msg=document.getElementById("import-msg");
  msg.textContent="Reading…"; msg.style.color="#64748b";

  // Dynamically load SheetJS only when needed
  if(typeof XLSX==="undefined"){
    const s=document.createElement("script");
    s.src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js";
    s.onload=()=>doImport(file,msg);
    s.onerror=()=>{msg.textContent="✗ Need internet to import Excel";msg.style.color="#dc2626";};
    document.head.appendChild(s);
  } else doImport(file,msg);
  input.value="";
}

function doImport(file,msg){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary",cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
      const tasks=rows.slice(1).filter(r=>r[0]).map((r,i)=>{
        let date=r[2];
        if(date instanceof Date){date=`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`}
        else{
          const s=String(date||"");
          const m1=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
          const m2=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          if(m1) date=`20${m1[3]}-${pad(+m1[1])}-${pad(+m1[2])}`;
          else if(m2) date=`${m2[3]}-${pad(+m2[1])}-${pad(+m2[2])}`;
          else date=null;
        }
        return{id:i,name:String(r[0]),desc:r[1]?String(r[1]):"",date,pri:r[3]?String(r[3]):"Low",cat:assignCat(String(r[0]))};
      });
      saveTasks(tasks); saveStatus({});
      renderCats(enrich(tasks));
      render();
      msg.textContent=`✓ ${tasks.length} tasks imported`; msg.style.color="#16a34a";
    }catch{msg.textContent="✗ Could not read file"; msg.style.color="#dc2626";}
  };
  reader.readAsBinaryString(file);
}

/* ── Modal helpers ────────────────────────── */
function openOverlay(id){document.getElementById(id).classList.add("show");document.body.style.overflow="hidden"}
function closeOverlay(id,e){
  if(e&&e.target!==document.getElementById(id))return;
  document.getElementById(id).classList.remove("show");
  document.body.style.overflow="";
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    document.querySelectorAll(".overlay.show").forEach(o=>{o.classList.remove("show");document.body.style.overflow=""});
  }
});

/* ── Toast ────────────────────────────────── */
let toastTimer;
function showToast(msg,color="#16a34a"){
  const el=document.getElementById("toast");
  el.textContent=msg; el.style.background=color;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),3000);
}

/* ── Boot ─────────────────────────────────── */
document.addEventListener("DOMContentLoaded",()=>{
  const now=new Date();
  document.getElementById("sb-date").textContent=
    now.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
  renderCats(enrich(getTasks()));
  render();
});
</script>
