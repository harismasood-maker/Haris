<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSS Task Reminders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --sidebar-w: 265px; }

        * { box-sizing: border-box; }

        body {
            background: #f0f3f8;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-w);
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            position: fixed;
            left: 0; top: 0;
            overflow-y: auto;
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            padding: 1.25rem 1.25rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .sidebar-logo .app-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-section { padding: .75rem 1rem; }

        .section-label {
            font-size: .65rem;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: #64748b;
            margin-bottom: .5rem;
            padding: 0 .25rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .45rem .6rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: .82rem;
            color: #94a3b8;
            transition: background .12s, color .12s;
            user-select: none;
        }

        .nav-item:hover { background: rgba(255,255,255,.07); color: #e2e8f0; }
        .nav-item.active { background: rgba(99,102,241,.25); color: #a5b4fc; }

        .nav-item .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .nav-item .count {
            margin-left: auto;
            font-size: .65rem;
            padding: .15em .5em;
            border-radius: 999px;
            background: rgba(255,255,255,.1);
            color: #cbd5e1;
        }

        /* ── Main ── */
        .main { margin-left: var(--sidebar-w); }

        .topbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(240,243,248,.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e2e8f0;
            padding: .85rem 1.5rem;
        }

        .search-wrap {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: .4rem .75rem;
            gap: .5rem;
            width: 300px;
            transition: box-shadow .15s;
        }
        .search-wrap:focus-within { box-shadow: 0 0 0 3px rgba(99,102,241,.15); border-color: #a5b4fc; }
        .search-wrap input { border: none; outline: none; font-size: .85rem; background: transparent; flex: 1; }

        .content { padding: 1.5rem; }

        /* ── Stat Cards ── */
        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 1.1rem 1.25rem;
            border: 1px solid #e8edf3;
        }
        .stat-num { font-size: 1.9rem; font-weight: 800; line-height: 1; }
        .stat-lbl { font-size: .75rem; color: #94a3b8; margin-top: .2rem; }
        .stat-bar { height: 3px; border-radius: 2px; background: #e2e8f0; margin-top: .75rem; overflow: hidden; }
        .stat-bar-fill { height: 100%; border-radius: 2px; transition: width .6s ease; }

        /* ── Banners ── */
        .banner-today {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white; border-radius: 14px; padding: 1rem 1.25rem;
            margin-bottom: .75rem;
        }
        .banner-tomorrow {
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            color: white; border-radius: 14px; padding: 1rem 1.25rem;
            margin-bottom: .75rem;
        }
        .banner-title { font-weight: 700; font-size: .9rem; margin-bottom: .35rem; }
        .banner-item { font-size: .8rem; opacity: .92; }

        /* ── Task Cards ── */
        .task-card {
            background: white;
            border-radius: 12px;
            padding: 1rem 1.1rem;
            margin-bottom: .6rem;
            border: 1px solid #e8edf3;
            border-left: 4px solid transparent;
            transition: box-shadow .15s, transform .1s;
        }
        .task-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.07); transform: translateY(-1px); }
        .task-card.today    { border-left-color: #ef4444; background: #fff8f8; }
        .task-card.tomorrow { border-left-color: #f59e0b; background: #fffbf0; }
        .task-card.overdue  { border-left-color: #dc2626; background: #fff5f5; }
        .task-card.done     { opacity: .6; }
        .task-card.done .task-name { text-decoration: line-through; color: #94a3b8; }

        .task-name { font-weight: 600; font-size: .9rem; }
        .task-desc { font-size: .78rem; color: #64748b; margin-top: .2rem; }

        .badge-pill {
            display: inline-block;
            padding: .25em .7em;
            border-radius: 999px;
            font-size: .68rem;
            font-weight: 600;
            line-height: 1.4;
        }

        /* ── Action buttons ── */
        .btn-done  { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; font-size: .78rem; padding: .3rem .75rem; border-radius: 8px; }
        .btn-done:hover  { background: #dcfce7; }
        .btn-undo  { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; font-size: .78rem; padding: .3rem .75rem; border-radius: 8px; }
        .btn-undo:hover  { background: #f1f5f9; }
        .btn-email { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; font-size: .78rem; padding: .3rem .75rem; border-radius: 8px; }
        .btn-email:hover { background: #dbeafe; }

        /* ── Empty state ── */
        .empty-state { text-align: center; padding: 3.5rem 1rem; color: #cbd5e1; }

        /* ── Modal tweaks ── */
        .modal-content { border-radius: 16px; border: none; }
        .modal-header { border: none; padding-bottom: 0; }
        .modal-footer { border: none; }
        .task-info-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: .85rem 1rem; }
    </style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="d-flex align-items-center gap-2">
            <div class="app-icon">
                <i class="bi bi-bell-fill text-white" style="font-size:.9rem;"></i>
            </div>
            <div>
                <div style="font-weight:700;font-size:.92rem;">BSS Reminders</div>
                <div style="font-size:.68rem;color:#64748b;" id="today-date-sidebar">—</div>
            </div>
        </div>
    </div>

    <!-- Status -->
    <div class="sidebar-section">
        <div class="section-label">View</div>
        <div class="nav-item active" data-filter="all"     onclick="setStatus('all',this)">
            <i class="bi bi-grid-3x3-gap-fill" style="font-size:.8rem;"></i> All Tasks
            <span class="count" id="cnt-all">—</span>
        </div>
        <div class="nav-item" data-filter="pending"  onclick="setStatus('pending',this)">
            <i class="bi bi-clock" style="font-size:.8rem;"></i> Pending
            <span class="count" id="cnt-pending">—</span>
        </div>
        <div class="nav-item" data-filter="done"     onclick="setStatus('done',this)">
            <i class="bi bi-check-circle" style="font-size:.8rem;"></i> Completed
            <span class="count" id="cnt-done">—</span>
        </div>
        <div class="nav-item" data-filter="overdue"  onclick="setStatus('overdue',this)">
            <i class="bi bi-exclamation-triangle" style="font-size:.8rem;color:#f87171;"></i> Overdue
            <span class="count" id="cnt-overdue">—</span>
        </div>
    </div>

    <!-- Priority -->
    <div class="sidebar-section border-top" style="border-color:rgba(255,255,255,.07)!important;padding-top:.85rem;">
        <div class="section-label">Priority</div>
        <div class="nav-item" onclick="togglePri('High',this)">
            <span class="dot" style="background:#ef4444;"></span> High
        </div>
        <div class="nav-item" onclick="togglePri('Medium',this)">
            <span class="dot" style="background:#f59e0b;"></span> Medium
        </div>
        <div class="nav-item" onclick="togglePri('Low',this)">
            <span class="dot" style="background:#22c55e;"></span> Low
        </div>
    </div>

    <!-- Categories -->
    <div class="sidebar-section border-top" style="border-color:rgba(255,255,255,.07)!important;padding-top:.85rem;">
        <div class="section-label">Categories</div>
        <div id="cat-filters"></div>
    </div>
</div>

<!-- ═══════════════ MAIN ═══════════════ -->
<div class="main">

    <!-- Top bar -->
    <div class="topbar d-flex align-items-center gap-3">
        <div>
            <div style="font-weight:700;font-size:1.05rem;">Task Dashboard</div>
            <div style="font-size:.75rem;color:#94a3b8;" id="task-count-label">Loading…</div>
        </div>
        <div class="ms-auto">
            <div class="search-wrap">
                <i class="bi bi-search text-muted" style="font-size:.8rem;"></i>
                <input type="text" id="search" placeholder="Search tasks…" oninput="render()">
            </div>
        </div>
    </div>

    <div class="content">

        <!-- Stats -->
        <div class="row g-3 mb-4" id="stats-row">
            <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-num text-muted">—</div><div class="stat-lbl">Loading</div></div></div>
        </div>

        <!-- Banners -->
        <div id="banners"></div>

        <!-- Task list -->
        <div id="task-list">
            <div class="empty-state">
                <i class="bi bi-hourglass-split" style="font-size:2rem;"></i>
                <p class="mt-2" style="font-size:.9rem;">Loading tasks…</p>
            </div>
        </div>

    </div>
</div>

<!-- ═══════════════ MODALS ═══════════════ -->

<!-- Complete modal -->
<div class="modal fade" id="doneModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header pb-0">
                <h6 class="modal-title fw-bold">
                    <i class="bi bi-check-circle-fill text-success me-2"></i>Mark Task as Done
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="task-info-box mb-3">
                    <div class="fw-semibold" id="m-name"></div>
                    <div class="text-muted mt-1" style="font-size:.8rem;" id="m-desc"></div>
                    <div class="mt-2 d-flex gap-2 flex-wrap" id="m-badges"></div>
                </div>
                <label class="form-label fw-semibold" style="font-size:.8rem;color:#64748b;">Completion Notes <span class="fw-normal">(optional)</span></label>
                <textarea class="form-control" id="m-notes" rows="3" placeholder="Notes on how this task was completed…" style="font-size:.85rem;border-radius:10px;"></textarea>
            </div>
            <div class="modal-footer pt-0">
                <button class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success btn-sm" onclick="confirmDone()">
                    <i class="bi bi-check-lg me-1"></i>Mark as Done
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Email modal -->
<div class="modal fade" id="emailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow-lg">
            <div class="modal-header pb-0">
                <h6 class="modal-title fw-bold">
                    <i class="bi bi-envelope-fill text-primary me-2"></i>Send Email Reminder
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold" style="font-size:.78rem;color:#64748b;">To</label>
                        <input type="email" class="form-control" id="e-to" placeholder="recipient@example.com" style="border-radius:10px;font-size:.85rem;">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" style="font-size:.78rem;color:#64748b;">Subject</label>
                        <input type="text" class="form-control" id="e-subject" style="border-radius:10px;font-size:.85rem;">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" style="font-size:.78rem;color:#64748b;">Message</label>
                        <textarea class="form-control" id="e-body" rows="6" style="border-radius:10px;font-size:.85rem;"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer pt-0">
                <button class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary btn-sm" onclick="sendEmail()">
                    <i class="bi bi-send me-1"></i>Open Email Client
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:1200;">
    <div id="liveToast" class="toast text-white border-0" role="alert" style="min-width:220px;">
        <div class="d-flex">
            <div class="toast-body fw-semibold" id="toast-msg" style="font-size:.85rem;"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── State ──────────────────────────────────────────────
let allTasks   = [];
let statusMode = 'all';
let priSet     = new Set();
let catSet     = new Set();
let activeId   = null;

// ── Category palette ──────────────────────────────────
const CAT = {
    'Recovery':        { bg:'#dbeafe', fg:'#1d4ed8', dot:'#3b82f6' },
    'Training':        { bg:'#ede9fe', fg:'#6d28d9', dot:'#8b5cf6' },
    'QA & Reporting':  { bg:'#ccfbf1', fg:'#0f766e', dot:'#14b8a6' },
    'Certificates':    { bg:'#fef9c3', fg:'#92400e', dot:'#eab308' },
    'Passouts':        { bg:'#ffedd5', fg:'#c2410c', dot:'#f97316' },
    'ID Cards':        { bg:'#e0e7ff', fg:'#3730a3', dot:'#6366f1' },
    'Appraisals':      { bg:'#fce7f3', fg:'#9d174d', dot:'#ec4899' },
    'Admissions':      { bg:'#dcfce7', fg:'#15803d', dot:'#22c55e' },
    'Sprint Management':{ bg:'#cffafe', fg:'#0e7490', dot:'#06b6d4' },
    'Financial':       { bg:'#fef3c7', fg:'#b45309', dot:'#f59e0b' },
    'Administration':  { bg:'#f1f5f9', fg:'#475569', dot:'#94a3b8' },
    'General':         { bg:'#f8fafc', fg:'#64748b', dot:'#cbd5e1' },
};

const PRI = {
    'High':   { bg:'#fee2e2', fg:'#dc2626' },
    'Medium': { bg:'#fef3c7', fg:'#d97706' },
    'Low':    { bg:'#dcfce7', fg:'#16a34a' },
};

// ── Helpers ────────────────────────────────────────────
function fmt(d) {
    if (!d) return 'No date';
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
}

function pill(text, bg, fg) {
    return `<span class="badge-pill" style="background:${bg};color:${fg};">${text}</span>`;
}

function toast(msg, color = '#16a34a') {
    const el = document.getElementById('liveToast');
    el.style.background = color;
    document.getElementById('toast-msg').textContent = msg;
    new bootstrap.Toast(el, { delay: 3000 }).show();
}

// ── Filters ────────────────────────────────────────────
function setStatus(mode, el) {
    statusMode = mode;
    document.querySelectorAll('.sidebar .nav-item[data-filter]').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    render();
}

function togglePri(p, el) {
    priSet.has(p) ? priSet.delete(p) : priSet.add(p);
    el.classList.toggle('active');
    render();
}

function toggleCat(c, el) {
    catSet.has(c) ? catSet.delete(c) : catSet.add(c);
    el.classList.toggle('active');
    render();
}

function filtered() {
    const q = document.getElementById('search').value.toLowerCase();
    return allTasks.filter(t => {
        if (statusMode === 'pending' && t.done) return false;
        if (statusMode === 'done'    && !t.done) return false;
        if (statusMode === 'overdue' && !t.is_overdue) return false;
        if (priSet.size > 0 && !priSet.has(t.priority)) return false;
        if (catSet.size > 0 && !catSet.has(t.category)) return false;
        if (q && !t.name.toLowerCase().includes(q) && !t.description.toLowerCase().includes(q)) return false;
        return true;
    });
}

// ── Render ─────────────────────────────────────────────
function renderStats() {
    const total   = allTasks.length;
    const done    = allTasks.filter(t => t.done).length;
    const overdue = allTasks.filter(t => t.is_overdue).length;
    const tmrw    = allTasks.filter(t => t.is_tomorrow && !t.done).length;
    const pct     = total ? Math.round(done / total * 100) : 0;

    document.getElementById('cnt-all').textContent     = total;
    document.getElementById('cnt-pending').textContent = total - done;
    document.getElementById('cnt-done').textContent    = done;
    document.getElementById('cnt-overdue').textContent = overdue;

    document.getElementById('stats-row').innerHTML = `
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-num" style="color:#6366f1;">${total}</div>
                <div class="stat-lbl">Total Tasks</div>
                <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%;background:#6366f1;"></div></div>
                <div style="font-size:.7rem;color:#94a3b8;margin-top:.25rem;">${pct}% complete</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-num" style="color:#16a34a;">${done}</div>
                <div class="stat-lbl">Completed</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-num" style="color:#f59e0b;">${tmrw}</div>
                <div class="stat-lbl">Due Tomorrow</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-num" style="color:#ef4444;">${overdue}</div>
                <div class="stat-lbl">Overdue</div>
            </div>
        </div>
    `;
}

function renderBanners() {
    const todayList  = allTasks.filter(t => t.is_today    && !t.done);
    const tmrwList   = allTasks.filter(t => t.is_tomorrow && !t.done);
    let html = '';

    if (todayList.length) {
        html += `
        <div class="banner-today d-flex gap-3 align-items-start">
            <i class="bi bi-alarm-fill fs-5 mt-1"></i>
            <div>
                <div class="banner-title">&#x1F6A8; ${todayList.length} Task${todayList.length > 1 ? 's' : ''} Due TODAY</div>
                ${todayList.map(t => `<div class="banner-item">• ${t.name} <span style="opacity:.75;">(${t.priority})</span></div>`).join('')}
            </div>
        </div>`;
    }

    if (tmrwList.length) {
        html += `
        <div class="banner-tomorrow d-flex gap-3 align-items-start">
            <i class="bi bi-bell-fill fs-5 mt-1"></i>
            <div>
                <div class="banner-title">&#x23F0; ${tmrwList.length} Reminder${tmrwList.length > 1 ? 's' : ''} for TOMORROW</div>
                ${tmrwList.map(t => `<div class="banner-item">• ${t.name} <span style="opacity:.75;">(${t.priority})</span></div>`).join('')}
            </div>
        </div>`;
    }

    document.getElementById('banners').innerHTML = html;
}

function renderCatFilters() {
    const cats = [...new Set(allTasks.map(t => t.category))].sort();
    document.getElementById('cat-filters').innerHTML = cats.map(c => {
        const col = CAT[c] || CAT['General'];
        const n   = allTasks.filter(t => t.category === c).length;
        return `
        <div class="nav-item" onclick="toggleCat('${c}', this)">
            <span class="dot" style="background:${col.dot};"></span>
            <span>${c}</span>
            <span class="count">${n}</span>
        </div>`;
    }).join('');
}

function render() {
    const tasks = filtered();
    document.getElementById('task-count-label').textContent =
        `${tasks.length} task${tasks.length !== 1 ? 's' : ''}`;

    if (!tasks.length) {
        document.getElementById('task-list').innerHTML = `
            <div class="empty-state">
                <i class="bi bi-inbox" style="font-size:2.5rem;opacity:.35;"></i>
                <p class="mt-2" style="font-size:.88rem;">No tasks match your filters</p>
            </div>`;
        return;
    }

    // Sort: overdue/today/tomorrow first → by date → done last
    tasks.sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const rank = t => t.is_today ? 0 : t.is_tomorrow ? 1 : t.is_overdue ? 2 : 3;
        if (rank(a) !== rank(b)) return rank(a) - rank(b);
        if (a.date && b.date) return a.date.localeCompare(b.date);
        return 0;
    });

    document.getElementById('task-list').innerHTML = tasks.map(t => {
        const cat = CAT[t.category] || CAT['General'];
        const pri = PRI[t.priority] || PRI['Low'];

        let urgencyBadge = '';
        let cardClass    = '';
        if (t.is_today)    { urgencyBadge = `<span class="badge-pill" style="background:#ef4444;color:white;">TODAY</span>`; cardClass = 'today'; }
        else if (t.is_tomorrow) { urgencyBadge = `<span class="badge-pill" style="background:#f59e0b;color:white;">TOMORROW</span>`; cardClass = 'tomorrow'; }
        else if (t.is_overdue)  { urgencyBadge = `<span class="badge-pill" style="background:#dc2626;color:white;">OVERDUE</span>`; cardClass = 'overdue'; }

        const actionBtn = t.done
            ? `<button class="btn-undo" onclick="undo(${t.id})"><i class="bi bi-arrow-counterclockwise me-1"></i>Undo</button>`
            : `<button class="btn-done" onclick="openDone(${t.id})"><i class="bi bi-check-lg me-1"></i>Done</button>`;

        const notesTip = t.notes ? `<span style="font-size:.72rem;color:#94a3b8;"><i class="bi bi-sticky me-1"></i>${t.notes}</span>` : '';
        const doneBadge = t.done ? `<span style="font-size:.72rem;color:#16a34a;font-weight:600;"><i class="bi bi-check-circle-fill me-1"></i>Completed</span>` : '';

        return `
        <div class="task-card ${cardClass} ${t.done ? 'done' : ''}">
            <div class="d-flex gap-3 align-items-start">
                <input type="checkbox" class="form-check-input mt-1" ${t.done ? 'checked' : ''}
                    style="width:1.1em;height:1.1em;cursor:pointer;flex-shrink:0;"
                    onchange="handleCheck(${t.id}, this.checked)">
                <div class="flex-grow-1" style="min-width:0;">
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                        <span class="task-name">${t.name}</span>
                        ${urgencyBadge}
                    </div>
                    <div class="task-desc">${t.description}</div>
                    <div class="d-flex flex-wrap gap-2 align-items-center mt-2">
                        ${pill(t.priority, pri.bg, pri.fg)}
                        ${pill(t.category, cat.bg, cat.fg)}
                        <span style="font-size:.74rem;color:#94a3b8;">
                            <i class="bi bi-calendar3 me-1"></i>${fmt(t.date)}
                        </span>
                        ${doneBadge}
                        ${notesTip}
                    </div>
                </div>
                <div class="d-flex gap-2 flex-shrink-0 flex-wrap justify-content-end">
                    ${actionBtn}
                    <button class="btn-email" onclick="openEmail(${t.id})">
                        <i class="bi bi-envelope me-1"></i>Email
                    </button>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ── Task actions ───────────────────────────────────────
function handleCheck(id, checked) {
    checked ? openDone(id) : undo(id);
}

function openDone(id) {
    const t = allTasks.find(x => x.id === id);
    if (!t) return;
    activeId = id;
    document.getElementById('m-name').textContent  = t.name;
    document.getElementById('m-desc').textContent  = t.description;
    document.getElementById('m-notes').value       = t.notes || '';
    const cat = CAT[t.category] || CAT['General'];
    const pri = PRI[t.priority] || PRI['Low'];
    document.getElementById('m-badges').innerHTML  =
        pill(t.priority, pri.bg, pri.fg) + ' ' + pill(t.category, cat.bg, cat.fg) +
        ` <span style="font-size:.72rem;color:#94a3b8;">${fmt(t.date)}</span>`;
    new bootstrap.Modal(document.getElementById('doneModal')).show();
}

async function confirmDone() {
    const notes = document.getElementById('m-notes').value;
    await fetch(`/api/tasks/${activeId}/complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes }),
    });
    bootstrap.Modal.getInstance(document.getElementById('doneModal')).hide();
    toast('Task marked as done!');
    await loadTasks();
}

async function undo(id) {
    await fetch(`/api/tasks/${id}/uncomplete`, { method: 'POST' });
    toast('Task moved back to pending', '#475569');
    await loadTasks();
}

function openEmail(id) {
    const t = allTasks.find(x => x.id === id);
    if (!t) return;
    activeId = id;
    document.getElementById('e-to').value      = '';
    document.getElementById('e-subject').value = `Task Reminder: ${t.name} — Due ${fmt(t.date)}`;
    document.getElementById('e-body').value    =
`Hi,

This is a reminder for the following task:

Task        : ${t.name}
Description : ${t.description}
Due Date    : ${fmt(t.date)}
Priority    : ${t.priority}
Category    : ${t.category}

Please ensure this task is actioned on time.

Regards`;
    new bootstrap.Modal(document.getElementById('emailModal')).show();
}

function sendEmail() {
    const to      = document.getElementById('e-to').value;
    const subject = encodeURIComponent(document.getElementById('e-subject').value);
    const body    = encodeURIComponent(document.getElementById('e-body').value);
    window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    bootstrap.Modal.getInstance(document.getElementById('emailModal')).hide();
    toast('Email client opened!', '#2563eb');
}

// ── Boot ───────────────────────────────────────────────
async function loadTasks() {
    const res = await fetch('/api/tasks');
    allTasks = await res.json();
    renderStats();
    renderBanners();
    renderCatFilters();
    render();
}

document.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    document.getElementById('today-date-sidebar').textContent =
        now.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
    loadTasks();
});
</script>
</body>
</html>
